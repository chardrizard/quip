<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="#111114"/>
  <!-- Q letter - bold geometric -->
  <text x="16" y="23" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="24" fill="#FFE03D" text-anchor="middle" letter-spacing="-1">Q</text>
  <!-- Accent dot — detached tail of Q, reinterpreted as a spark -->
  <circle cx="23" cy="24" r="2.5" fill="#FFE03D"/>
</svg>
